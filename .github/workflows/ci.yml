name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` / `unlabeled` re-run the checks when the
    # `characterization-change` or `api-unreleased-change` label is added or
    # removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint and format
        run: pnpm lint

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests with coverage
        run: pnpm vitest run --coverage
      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Same major version as the local development container.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gipiti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/gipiti_test
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:integration

  characterization-diff:
    name: Characterization diff guard
    # A pull request that changes pinned behaviour on purpose carries the
    # `characterization-change` label and skips this job.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'characterization-change')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard compares against the merge base with the base branch.
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check characterization tests
        run: pnpm check:characterization-diff "origin/${{ github.base_ref }}"

  api-breaking:
    name: API breaking changes
    # An endpoint of /api/v1 may only grow once a shipped client calls it
    # (docs/plans/2026-11-15-orpc-v1-roadmap.md, "Versioning policy"). This
    # job compares the committed OpenAPI snapshot with the base branch's and
    # fails on a breaking difference. A pull request that changes an endpoint
    # no shipped client calls yet says so in its body, carries the
    # `api-unreleased-change` label and skips this job.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'api-unreleased-change')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch's snapshot is read from its history.
          fetch-depth: 0
      - name: Collect both snapshots
        run: |
          mkdir -p "$RUNNER_TEMP/api-spec"
          git show "origin/${{ github.base_ref }}:server/api/v1/openapi.snapshot.json" \
            > "$RUNNER_TEMP/api-spec/base.json"
          cp server/api/v1/openapi.snapshot.json "$RUNNER_TEMP/api-spec/revision.json"
      - name: Look for breaking changes
        # The image is pinned: a newer oasdiff may classify a change
        # differently, and that should arrive as a reviewed version bump.
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP/api-spec:/specs:ro"
          tufin/oasdiff:v1.41.0
          breaking /specs/base.json /specs/revision.json --fail-on ERR
